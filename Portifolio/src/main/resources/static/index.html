<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="logo">Daniel<span>.Dev</span></div>
    <ul class="nav-links">
        <li><a href="#inicio">Home</a></li>
        <li><a href="#sobre">Sobre</a></li>
        <li><a href="#habilidades">Habilidades</a></li>
        <li><a href="#projetos">Projetos</a></li>
        <li><a href="#contato">Contato</a></li>
        <li><button onclick="toggleAdmin()" class="btn-admin">⚙️</button></li>
    </ul>
</nav>

<!-- Section Pai: Contém o fundo tecnológico e agrupa o conteúdo -->
<header id="inicio" class="hero-main-container">

    <!-- Section Filha Esquerda: Conteúdo de Escrita -->
    <section class="hero-text-side">
        <div class="glass-content">
            <h1>Olá, eu sou o <br><span class="highlight-blue">Daniel Adolfo</span></h1>
            <p>Desenvolvedor Full Stack especializado em construir soluções robustas e escaláveis com <strong>Java</strong> e <strong>Spring Boot</strong>.</p>
            <div class="hero-cta">
                <a href="#projetos" class="btn-main">Meus Projetos</a>
                <a href="#contato" class="btn-outline">Contato</a>
            </div>
        </div>
    </section>

    <!-- Section Filha Direita: Foto e Ferramentas -->
    <section class="hero-visual-side">
        <div class="orbit-wrapper">
            <!-- Moldura Hexagonal da Foto -->
            <div class="profile-hexagon">
                <img src="SUA-FOTO.jpg" alt="Daniel Adolfo">
            </div>

            <!-- Ícones das Ferramentas em Órbita -->
            <div class="tech-orbit">
                <div class="icon-item" style="--i:1"><i class="fab fa-java"></i><span>Java</span></div>
                <div class="icon-item" style="--i:2"><i class="fab fa-react"></i><span>React</span></div>
                <div class="icon-item" style="--i:3"><i class="fas fa-database"></i><span>SQL</span></div>
                <div class="icon-item" style="--i:4"><i class="fab fa-js"></i><span>JS</span></div>
                <div class="icon-item" style="--i:5"><i class="fab fa-aws"></i><span>AWS</span></div>
                <div class="icon-item" style="--i:6"><i class="fab fa-docker"></i><span>Docker</span></div>
                <div class="icon-item" style="--i:7"><i class="fab fa-git-alt"></i><span>Git</span></div>
                <div class="icon-item" style="--i:8"><i class="fab fa-python"></i><span>Python</span></div>
            </div>
        </div>
    </section>

</header>

<div id="admin-area" class="admin-overlay">
    <div class="prancheta">
        <button onclick="toggleAdmin()" class="btn-close">X</button>
    </div>
</div>
<main class="container">
    <div class="admin-area">
    <section class="admin-panel">
        <div class="formulario">
            <h3> Novo Projeto</h3>
            <div class="form-group">
                <label for="titulo">Projeto</label>
                <input type="text" id="titulo" placeholder="Ex: Sistema de Cadastro">

                <label for="tecnologia">Tecnologias</label>
                <input type="text" id="tecnologia" placeholder="Ex: Java & Spring">

                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="3" placeholder="Conte um pouco sobre o projeto..."></textarea>

                <label for="linkGithub">Link do Repositorio</label>
                <input type="text" id="linkGithub" placeholder="https://github.com/...">

                <button onclick="salvarProjeto()" class="btn-save">Salvar projeto</button>
            </div>
        </div>
    </section>
    </div>

    <section id="lista-projetos" class="projects-grid">
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
